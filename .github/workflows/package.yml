name: Publish Sheets

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: sheets-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate package and release versions
        id: version
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import re
          from pathlib import Path

          version = json.loads(Path("app.json").read_text())["version"]
          package_version = json.loads(Path("package.json").read_text())["version"]
          if not re.fullmatch(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", version) or package_version != version:
              raise SystemExit("App and package versions must match and use x.y.z")
          if os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit("Release tag must match app.json and package.json and use vX.Y.Z")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PYTHON

  package:
    name: Build and verify application archive
    needs: preflight
    runs-on: ubuntu-24.04
    container: node:26-trixie@sha256:e18c3ccdf7d71619990b0e85639f506e2028a95410999cab24cc373cbd10e0ac
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Prepare build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates unzip python3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build:pioneer
      - run: bun run package:pioneer
      - run: bun run verify:pioneer
      - uses: actions/upload-artifact@v4
        with:
          name: pioneer-sheets
          path: |
            dist/sheets-${{ needs.preflight.outputs.version }}.tar.gz
            dist/sheets-${{ needs.preflight.outputs.version }}.tar.gz.sha256
            dist/sheets-${{ needs.preflight.outputs.version }}.tar.gz.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish application release
    needs: [preflight, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pioneer-sheets
          path: release-assets
      - name: Publish verified package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          APP_VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          archive="sheets-${APP_VERSION}.tar.gz"
          sha256sum -c "$archive.sha256"
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$state" != true ]]; then
              echo "Refusing to overwrite an already published release" >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Sheets $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "$archive" "$archive.sha256" "$archive.json" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
