name: Sheets PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    container: node:26-trixie@sha256:e18c3ccdf7d71619990b0e85639f506e2028a95410999cab24cc373cbd10e0ac
    timeout-minutes: 40
    env:
      OFFICE_PYTHON: /usr/bin/python3
      PLAYWRIGHT_BROWSERS_PATH: /opt/sheets-browsers
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: apt-get update && apt-get install -y --no-install-recommends python3-openpyxl python3-docx python3-pypdf python3-pil fonts-dejavu-core fonts-liberation
      - run: bunx playwright install --with-deps chromium
      - run: bun run typecheck
      - run: bun run build:pioneer
      - run: bun run test:dev
      - run: bun run test
      - run: bun run test:e2e
      - run: bunx playwright install --with-deps webkit
      - run: bun run test:webkit
